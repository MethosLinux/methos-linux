# Methos Linux - GRUB Configuration
set default=0
set timeout=15

# Menu colors
set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

menuentry "Boot Methos Linux" {
    set archisobasedir=arch
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=${archisobasedir} archisodevice=/dev/disk/by-label/METHOS archisoboot=live cow_spacesize=4G quiet
    initrd /arch/boot/x86_64/intel-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Boot Methos Linux (nomodeset)" {
    set archisobasedir=arch
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=${archisobasedir} archisodevice=/dev/disk/by-label/METHOS archisoboot=live cow_spacesize=4G nomodeset quiet
    initrd /arch/boot/x86_64/intel-ucode.img /arch/boot/x86_64/initramfs-linux.img
}