# Methos Linux - GRUB Boot Configuration
# This configuration is used for both BIOS and UEFI boot modes
# Reference: https://wiki.archlinux.org/title/GRUB

# ============================================================================
# Global Settings
# ============================================================================

# Set default menu entry (0 = first entry)
set default="methos-linux"

# Timeout in seconds before booting default entry
set timeout=30

# Terminal output configuration
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm

# GRUB GFX Theme (basic - no advanced theme for Alpha)
# set theme=${prefix}/themes/methos/theme.txt

# ============================================================================
# Color Scheme
# ============================================================================

# Basic color scheme for boot menu
set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

# ============================================================================
# Boot Entries
# ============================================================================

# --- Main Entry: Boot Methos Linux Live ---
menuentry "Boot Methos Linux (Live System)" --id methos-linux {
    echo "Loading Methos Linux..."
    
    # Set Methos Linux specific kernel parameters
    set linux_cmd="archisobasedir=arch archiso_ssl=0 \
        cow_spacesize=4G \
        rd.luks=0 \
        rd.lvm=0 \
        rd.md=0 \
        rd.dm=0 \
        rd.auto=1 \
        quiet \
        loglevel=3 \
        udev.log_priority=3 \
        systemd.show_status=auto"
    
    # Load the kernel
    linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
    
    # Load the initramfs
    initrd /arch/boot/x86_64/initramfs-linux.img
    
    echo "Booting Methos Linux..."
}

# --- Fallback Entry: Boot with nomodeset ---
menuentry "Boot Methos Linux (nomodeset - Safe Graphics)" --id methos-linux-nomodeset {
    echo "Loading Methos Linux (safe graphics)..."
    
    set linux_cmd="archisobasedir=arch archiso_ssl=0 \
        cow_spacesize=4G \
        rd.luks=0 \
        rd.lvm=0 \
        rd.md=0 \
        rd.dm=0 \
        rd.auto=1 \
        nomodeset \
        quiet \
        loglevel=3 \
        udev.log_priority=3 \
        systemd.show_status=auto"
    
    # Load the kernel
    linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
    
    # Load the initramfs
    initrd /arch/boot/x86_64/initramfs-linux.img
}

# --- Debug Entry: Verbose Boot ---
menuentry "Boot Methos Linux (Verbose - Debug Mode)" --id methos-linux-debug {
    echo "Loading Methos Linux (debug mode)..."
    
    set linux_cmd="archisobasedir=arch archiso_ssl=0 \
        cow_spacesize=4G \
        rd.luks=0 \
        rd.lvm=0 \
        rd.md=0 \
        rd.dm=0 \
        rd.auto=1 \
        debug \
        systemd.log_level=debug \
        systemd.log_target=console \
        rd.shell=1"
    
    # Load the kernel
    linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
    
    # Load the initramfs
    initrd /arch/boot/x86_64/initramfs-linux.img
}

# --- Entry: Copy RAM (Load Entire ISO to RAM) ---
menuentry "Copy to RAM (Faster Boot)" --id methos-linux-copytoram {
    echo "Loading Methos Linux (copy to RAM)..."
    
    set linux_cmd="archisobasedir=arch archiso_ssl=0 \
        cow_spacesize=4G \
        rd.luks=0 \
        rd.lvm=0 \
        rd.md=0 \
        rd.dm=0 \
        rd.auto=1 \
        copytoram \
        quiet \
        loglevel=3 \
        udev.log_priority=3 \
        systemd.show_status=auto"
    
    # Load the kernel
    linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
    
    # Load the initramfs
    initrd /arch/boot/x86_64/initramfs-linux.img
}

# --- Entry: Boot from Hard Disk ---
menuentry "Boot from Hard Disk" --id boot-from-disk {
    # Try to chainload the bootloader from the first hard disk
    set root=(hd0)
    chainloader +1
}

# --- Entry: System Information ---
menuentry "System Information" --id system-info {
    echo "============================================"
    echo "  Methos Linux Build Information"
    echo "============================================"
    echo "Version:  $(cat /VERSION 2>/dev/null || echo 'unknown')"
    echo "Kernel:   linux"
    echo "Arch:     x86_64"
    echo "Init:     systemd"
    echo "Shell:    bash/zsh"
    echo ""
    echo "Press any key to return to the menu..."
    getkey
}

# --- Entry: Memtest86+ (if available) ---
if [ -f /boot/memtest86+/memtest.bin ]; then
    menuentry "Memory Test (Memtest86+)" --id memtest {
        linux /boot/memtest86+/memtest.bin
    }
fi

# --- Entry: Hardware Detection ---
menuentry "Hardware Detection" --id hwdetect {
    echo "Loading hardware detection..."
    set pager=1
    echo "============================================"
    echo "  Methos Linux - Hardware Detection"
    echo "============================================"
    echo ""
    
    # List PCI devices
    echo "--- PCI Devices ---"
    for pci in /sys/bus/pci/devices/*; do
        if [ -f "${pci}/class" ]; then
            class=$(cat "${pci}/class" 2>/dev/null)
            vendor=$(cat "${pci}/vendor" 2>/dev/null)
            device=$(cat "${pci}/device" 2>/dev/null)
            echo "  ${vendor}:${device} (class: ${class})"
        fi
    done
    
    echo ""
    echo "Press any key to return to the menu..."
    getkey
}

# ============================================================================
# Submenu: Advanced Options
# ============================================================================

submenu "Advanced Options -->" --id advanced {
    
    menuentry "Boot with ACPI disabled" --id noacpi {
        set linux_cmd="archisobasedir=arch archiso_ssl=0 \
            acpi=off \
            quiet"
        linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
        initrd /arch/boot/x86_64/initramfs-linux.img
    }
    
    menuentry "Boot with APIC disabled" --id noapic {
        set linux_cmd="archisobasedir=arch archiso_ssl=0 \
            noapic \
            quiet"
        linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
        initrd /arch/boot/x86_64/initramfs-linux.img
    }
    
    menuentry "Boot with single CPU core" --id singlecpu {
        set linux_cmd="archisobasedir=arch archiso_ssl=0 \
            maxcpus=0 \
            quiet"
        linux /arch/boot/x86_64/vmlinuz-linux ${linux_cmd}
        initrd /arch/boot/x86_64/initramfs-linux.img
    }
    
    menuentry "Reboot" --id reboot {
        reboot
    }
    
    menuentry "Shutdown" --id shutdown {
        halt
    }
}

# ============================================================================
# Default Boot
# ============================================================================

# Set the default boot entry if no timeout interaction
# This is handled by the default= directive at the top