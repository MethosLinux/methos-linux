# Methos Linux - mkinitcpio Configuration
# This file configures the initial ramdisk for the live environment
# Reference: https://wiki.archlinux.org/title/Mkinitcpio

# ============================================================================
# MODULES
# ============================================================================
# Modules to load before the root filesystem is available
# These are essential for hardware detection and filesystem access
MODULES=(
    # Filesystem modules - required to mount root
    ext4
    btrfs
    xfs
    vfat
    ntfs3

    # Storage controller modules
    ahci
    nvme
    virtio
    virtio_blk
    virtio_pci
    virtio_scsi

    # USB boot support
    usb_storage
    xhci_hcd
    ehci_hcd
    ohci_hcd

    # Loop device for squashfs (required for live ISO)
    loop
    
    # Device mapper for LUKS/LVM
    dm_mod
    dm_crypt
    
    # Network modules for network boot
    e1000
    e1000e
    r8169
    iwlwifi
)

# ============================================================================
# BINARIES
# ============================================================================
# Additional binaries to include in the initramfs
BINARIES=(
    # Filesystem tools
    fsck.ext4
    fsck.btrfs
    fsck.xfs
    fsck.vfat
    
    # Device mapper tools
    cryptsetup
    
    # Network tools
    ip
    ping
    
    # System tools
    lsblk
    mount
    umount
)

# ============================================================================
# FILES
# ============================================================================
# Additional files to include in the initramfs
FILES=(
    # Encryption keyfile (if using LUKS)
    # /etc/cryptsetup-keys.d/methos.key
)

# ============================================================================
# HOOKS
# ============================================================================
# Hooks determine the order of initialization steps
# Order matters - hooks are executed in the order listed

HOOKS=(
    # 1. Load essential modules
    base
    
    # 2. Detect and load necessary kernel modules for hardware
    udev
    
    # 3. Auto-detect and load modules for the running system
    autodetect
    
    # 4. Load keyboard drivers for entering encryption passphrase
    keyboard
    
    # 5. Load console font
    consolefont
    
    # 6. Load keymap for non-US keyboards
    keymap
    
    # 7. Load storage controller modules
    block
    
    # 8. Encrypted root filesystem support
    encrypt
    
    # 9. LVM logical volume support
    lvm2
    
    # 10. Filesystem check
    fsck
    
    # 11. Mount root filesystem
    filesystems
)

# ============================================================================
# COMPRESSION
# ============================================================================
# Compression algorithm for the initramfs
# Options: cat (no compression), gzip, bzip2, lz4, lzo, lzop, xz, zstd
COMPRESSION="zstd"

# Compression level
# zstd levels: 1-19 (higher = better compression, slower)
COMPRESSION_OPTIONS=(
    -1
)