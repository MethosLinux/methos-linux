# Methos Linux - NVIDIA Graphics Configuration
# Options for NVIDIA GPU drivers

# Enable NVIDIA DRM (Direct Rendering Manager) for Wayland support
# This is needed for modern NVIDIA driver integration
options nvidia_drm modeset=1 fbdev=1

# Enable triple buffering for smoother performance
options nvidia NVreg_UsePageAttributeTable=1

# Enable dynamic power management for laptop GPUs
# 0x00 = off, 0x01 = enable, 0x02 = enable with render offload
options nvidia NVreg_DynamicPowerManagement=0x02

# Enable 32-bit compatibility
options nvidia NVreg_EnableMSI=1

# Enable GSP firmware for RTX 30+ series
options nvidia NVreg_EnableGpuFirmware=1

# Prefer nvidia module over nouveau (open source driver)
blacklist nouveau
alias nvidia nvidia_drm