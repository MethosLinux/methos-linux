# Methos Linux - Blacklisted Kernel Modules
# Modules listed here will be prevented from loading
# These are modules known to cause issues on various hardware

# Disable PC speaker (annoying beep)
blacklist pcspkr
blacklist snd_pcsp

# Disable legacy floppy controller (not needed)
blacklist floppy

# Disable ZRAM (we manage swap via systemd)
blacklist zram

# Disable vivid (test driver for video, causes issues on some systems)
blacklist vivid