# Methos Linux - Calamares Partition Module
# Disk partitioning configuration
# Supports manual and automatic partitioning

# Partitioning mode: "erase" (auto), "alongside" (dual-boot), "manual"
defaultPartitioning: "erase"

# Allow manual partitioning
allowManualPartitioning: true

# Draw partition labels on partitions
drawNestedPartitions: false

# Always show partition labels
alwaysShowPartitionLabels: true

# Filesystem types available for new partitions
availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"
    - "f2fs"
    - "ntfs"
    - "fat32"

# Default filesystem for root partition
defaultFileSystemType: "ext4"

# Swap options
# "file" - swap file (recommended), "partition" - swap partition, "none" - no swap
swap:
    choice: "file"
    fileSize: 2048         # MB
    # For suspend-to-RAM, file should equal or exceed RAM
    # "suspendToRam" will auto-calculate file size
    suspendToRam: false

# Encryption options
# Enable LUKS encryption option in the UI
enableLuks: true

# LUKS encryption algorithm
luks:
    algorithm: "aes-xts-plain64"
    keySize: 512
    hash: "sha512"
    iterTime: 2000

# EFI system partition size (MB)
efiSystemPartitionSize: 512

# Boot partition size (MB)
bootPartitionSize: 1024

# Ensure /boot/efi is a separate partition for UEFI
ensureEfiSystemPartition: true

# Require GPT partition table
initialPartitioning: "gpt"

# Configurable options
partitionLayouts:
    - name: "Single partition"
      partitions:
        - name: "root"
          role: "root"
          filesystem: "ext4"
          percentage: 100
          
    - name: "Root + Home"
      partitions:
        - name: "root"
          role: "root"
          filesystem: "ext4"
          percentage: 50
        - name: "home"
          role: "home"
          filesystem: "ext4"
          percentage: 50
          
    - name: "Root + Home + Swap"
      partitions:
        - name: "root"
          role: "root"
          filesystem: "ext4"
          percentage: 40
        - name: "home"
          role: "home"
          filesystem: "ext4"
          percentage: 50
        - name: "swap"
          role: "swap"
          filesystem: "linuxswap"
          percentage: 10