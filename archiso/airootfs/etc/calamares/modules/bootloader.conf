# Methos Linux - Calamares Bootloader Module (Single Point)
# Handles: GRUB installation + mkinitcpio generation + machine-id
# This is the ONLY boot-related module for Alpha

# ============================================================================
# GRUB Configuration
# ============================================================================

# Install GRUB for both BIOS and UEFI
bootloader: "grub"
grubInstall: "grub-install"

# GRUB configuration file
grubCfg: "/boot/grub/grub.cfg"
grubConfig: "grub-mkconfig"

# Kernel parameters to add
kernelParams:
    - "quiet"
    - "loglevel=3"
    - "udev.log_priority=3"
    - "systemd.show_status=auto"

# GRUB timeout (seconds)
grubTimeout: 5

# Enable OS probing for dual-boot
osProber: true
disableSubmenu: true

# GRUB theme (minimal for Alpha)
theme: "/usr/share/grub/themes/methos"

# Default entry name
defaultEntry: "Methos Linux"

# ============================================================================
# Bootloader Installation
# ============================================================================

# Support both BIOS and UEFI
bios: true
efi: true

# EFI directory
efiDir: "/boot"

# Update NVRAM entries
updateNvram: true

# Fallback to BIOS if UEFI fails
fallbackToBios: true

# ============================================================================
# mkinitcpio Configuration (generated after kernel install)
# ============================================================================

kernel: linux

# Initramfs hooks
initramfsHooks:
    - base
    - udev
    - autodetect
    - keyboard
    - keymap
    - consolefont
    - modconf
    - block
    - filesystems
    - fsck

# Initramfs modules
initramfsModules:
    - ext4
    - btrfs
    - nvme
    - ahci
    - loop

# Initramfs compression
initramfsCompression: "zstd"

# ============================================================================
# systemd-boot (Fallback, not actively used in Alpha)
