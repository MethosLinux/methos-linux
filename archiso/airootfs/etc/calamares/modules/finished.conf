# Methos Linux - Calamares Finished Module
# Final screen shown after installation is complete

# Restart behavior
restartNowEnabled: true
restartNowChecked: true

# Message shown on completion
finishedMessage: |
    <h2>Installation Complete</h2>
    <p>Methos Linux has been installed successfully.</p>
    <p><b>What's next?</b></p>
    <ul>
        <li>Remove the installation media</li>
        <li>Click <b>Restart</b> to boot into your new Methos Linux system</li>
        <li>After first boot, you can customize your system using the Methos tools</li>
    </ul>
    <p>Thank you for choosing Methos Linux!</p>

# Show the restart button even if the live session can't reboot
forceShowRestart: true

# Set the machine hostname in the installed system
setHostname: true