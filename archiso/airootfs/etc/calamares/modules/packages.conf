# Methos Linux - Calamares Packages Module (Online Installation)
# SECURE MODE: Only uses official Arch repositories (core/extra/community/multilib)
# Conflict-safe: Uses --dry-run before actual installation
# Profile merging: Union with conflict resolution via priority rules

backend: "pacman"
pacman-conf: "/etc/pacman.conf"

operations:
    # -----------------------------------------------------------------
    # GROUP 1: Base system (always installed first)
    # -----------------------------------------------------------------
    - install:
        - base
        - base-devel
        - linux
        - linux-firmware
        - linux-headers
        - dkms
        - amd-ucode
        - intel-ucode

    # -----------------------------------------------------------------
    # GROUP 2: KDE Plasma Desktop (always installed)
    # -----------------------------------------------------------------
    - install:
        - plasma-meta
        - plasma-wayland-session
        - sddm
        - dolphin
        - konsole
        - kate
        - systemsettings
        - kf6
        - kde-gtk-config
        - breeze
        - breeze-gtk
        - gwenview
        - okular
        - spectacle
        - kcalc
        - ark
        - filelight
        - partitionmanager

    # -----------------------------------------------------------------
    # GROUP 3: Core utilities (always installed)
    # -----------------------------------------------------------------
    - install:
        - sudo
        - nano
        - neovim
        - vim
        - git
        - curl
        - wget
        - htop
        - btop
        - neofetch
        - fastfetch
        - kitty
        - tmux
        - screen
        - unzip
        - zip
        - tar
        - gzip
        - p7zip
        - rsync
        - openssh
        - networkmanager
        - network-manager-applet
        - firefox
        - cups
        - system-config-printer
        - bluedevil
        - pipewire
        - pipewire-alsa
        - pipewire-pulse
        - wireplumber
        - pavucontrol
        - noto-fonts
        - noto-fonts-emoji
        - ttf-jetbrains-mono
        - ttf-nerd-fonts-symbols
        - power-profiles-daemon
        - acpid
        - iwd
        - dhcpcd
        - dnsutils
        - net-tools

    # -----------------------------------------------------------------
    # GROUP 4: Try-install NVIDIA (optional, not guaranteed to exist)
    # -----------------------------------------------------------------
    - try_install:
        - nvidia
        - nvidia-dkms
        - nvidia-utils
        - nvidia-settings
        - nvidia-prime

    # -----------------------------------------------------------------
    # GROUP 5: User-selected profiles (handled by merge_profiles.sh)
    # The script reads /tmp/methos-selected-profiles.json, resolves
    # conflicts via priority rules, then installs via pacman
    # -----------------------------------------------------------------
    - run:
        - command: "/etc/calamares/scripts/merge_profiles.sh"
          chroot: true
          timeout: 600

# -----------------------------------------------------------------
# POST-INSTALLATION: Enable system services in target
# -----------------------------------------------------------------
post_operations:
    - enable:
        - NetworkManager
        - sddm
        - bluetooth
        - cups
        - systemd-resolved
        - systemd-timesyncd
        - fstrim

    # Update system after all packages are installed
    - run:
        - command: "pacman -Syu --noconfirm"
          chroot: true
          timeout: 120