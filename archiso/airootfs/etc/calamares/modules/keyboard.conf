# Methos Linux - Calamares Keyboard Module
# Keyboard layout configuration for installation

# Available keyboard layouts
keyboardLayouts:
    - "us"
    - "us(intl)"
    - "ara"
    - "de"
    - "fr"
    - "es"
    - "it"
    - "jp"
    - "ru"
    - "tr"
    - "gb"
    - "cz"
    - "pl"
    - "se"

# Default keyboard model
keyboardModel: "pc105"

# Keyboard options (e.g., Caps Lock behavior, AltGr mapping)
keyboardOptions:
    - "grp:alt_shift_toggle"
    - "terminate:ctrl_alt_bksp"
    - "ctrl:nocaps"

# Detect keyboard from live system
detectKeyboard: true

# Set the keyboard layout immediately (in the live session)
xkbLayout: "us"
xkbModel: "pc105"
xkbVariant: ""
xkbOptions: "grp:alt_shift_toggle"