# Methos Linux - Calamares Locale Module
# Location, language, and timezone settings

# Language to use during installation
language: "en"

# List of available locales
locale:
    - "en_US.UTF-8"
    - "ar_IQ.UTF-8"
    - "ar_AE.UTF-8"
    - "fr_FR.UTF-8"
    - "de_DE.UTF-8"
    - "es_ES.UTF-8"
    - "zh_CN.UTF-8"
    - "ja_JP.UTF-8"
    - "ru_RU.UTF-8"
    - "tr_TR.UTF-8"

# Timezone region/city list
timezone:
    region: "Asia"
    zone: "Baghdad"
    regions:
        - "Africa"
        - "America"
        - "Antarctica"
        - "Arctic"
        - "Asia"
        - "Atlantic"
        - "Australia"
        - "Europe"
        - "Indian"
        - "Pacific"

# Whether to use GeoIP to detect location
geoip:
    url: "https://geolocation.methos-linux.org/json"
    selector: "timezone"
    style: "json"

# Locale generation settings
localeGenSettings:
    systemLocaleGen: true
    localeGenConf: "/etc/locale.gen"