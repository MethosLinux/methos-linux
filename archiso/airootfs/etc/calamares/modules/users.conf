# Methos Linux - Calamares Users Module
# User creation configuration

# Default username and hostname for the live session
defaultGroups:
    - "wheel"
    - "users"
    - "audio"
    - "video"
    - "optical"
    - "storage"
    - "rfkill"
    - "docker"
    - "libvirt"
    - "kvm"
    - "input"

# Autologin configuration
autologinGroup: "wheel"
doAutologin: false

# Password requirements
passwordRequirements:
    minLength: 1
    maxLength: 0
    allowWeakPasswords: true

# User shell
userShell: "/bin/bash"
availableShells:
    - "/bin/bash"
    - "/bin/zsh"
    - "/bin/fish"

# Root password
setRootPassword: true
doReusePassword: true

# Permit root login
permitRootLogin: true

# Default hostname
defaultHostname: "methos-pc"