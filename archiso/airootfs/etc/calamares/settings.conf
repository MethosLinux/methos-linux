# Methos Linux - Calamares Settings
# FINAL WORKFLOW ORDER (tested design):
# mount → unpackfs → packages → machineid → fstab → bootloader(mkinitcpio+grub)

modules-search:
    - /usr/lib/calamares/modules
    - /lib/calamares/modules
    - /etc/calamares/modules

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users

    - exec:
        - partition          # Write partitions to disk
        - mount              # Mount target to /mnt (REQUIRED for unpackfs)
        - unpackfs           # Extract squashfs live system to /mnt/target
        - networkcfg         # Copy NetworkManager config to target
        - packages            # Online install: base + KDE + NVIDIA + profiles
        - machineid          # Generate /etc/machine-id in target
        - fstab              # Generate /etc/fstab from mounted partitions
        - bootloader          # GRUB install + mkinitcpio (AFTER kernel is in place)
        - services            # Enable systemd services (NetworkManager, sddm, ...)

    - show:
        - finished

branding: methos
prompt-install: true
disable-cancel-during-exec: true
dont-chroot: false