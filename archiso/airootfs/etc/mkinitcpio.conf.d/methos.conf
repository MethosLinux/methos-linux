# Methos Linux - Custom mkinitcpio Configuration
# Additional configuration for the live system initramfs

# Override HOOKS from main configuration
HOOKS=(base udev autodetect keyboard keymap consolefont modconf block filesystems fsck)

# Add Methos-specific modules
MODULES=(loop squashfs overlay)

# Compression for mkinitcpio
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-1)

# Include essential binaries for the live environment
BINARIES=(
    mount
    modprobe
    lsblk
    lvm
    cryptsetup
    fsck.ext4
    fsck.btrfs
)