# Methos Linux - Pacman Configuration for ISO Build
# This configuration is used by mkarchiso when building the ISO
# Packages are fetched from the official Arch Linux mirrors

#
# GENERAL OPTIONS
#
[options]
# Use the same color scheme as the main system
Color

# Show download progress in a single line
ILoveCandy

# Always check PGP signatures for packages
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Parallel downloads (faster package resolution)
ParallelDownloads = 5

# Disable verbose package lists during installation
# VerbosePkgLists

# Disable debug packages in the live environment
# NoExtract = usr/lib/debug/

# Keep multiple versions of packages in cache
# CleanMethod = KeepCurrent

#
# REPOSITORIES
#

# Official Arch Linux core repository
# Contains essential packages for the base system
[core]
Include = /etc/pacman.d/mirrorlist

# Official Arch Linux extra repository
# Contains most desktop applications, development tools, etc.
[extra]
Include = /etc/pacman.d/mirrorlist

# Official Arch Linux community repository
# Contains community-maintained packages (AUR-style, but official)
[community]
Include = /etc/pacman.d/mirrorlist

# Official Arch Linux multilib repository
# Required for 32-bit compatibility on 64-bit systems
# Needed for Steam, Wine, and some gaming/professional applications
[multilib]
Include = /etc/pacman.d/mirrorlist

#
# CUSTOM REPOSITORIES (Future Use)
#
# These will be populated when Methos Linux develops its own packages
#

#[methos]
#SigLevel = Optional TrustAll
#Server = https://packages.methos-linux.org/$repo/$arch

# Local testing repository
#[methos-testing]
#SigLevel = Optional TrustAll
#Server = https://packages.methos-linux.org/$repo/$arch