name: Build Methos Linux ISO

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root --privileged

    steps:
    - name: Install deps + archiso
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git make base-devel squashfs-tools \
          libisoburn mtools dosfstools python python-pip
        cd /tmp
        git clone --depth 1 https://gitlab.archlinux.org/archlinux/archiso.git
        cd archiso
        make install 2>&1 || true
        cd /
        rm -rf /tmp/archiso
        which mkarchiso || echo "mkarchiso not found"

    - name: Checkout
      run: |
        git clone https://github.com/${{ github.repository }}.git /build
        cd /build && git checkout ${{ github.sha }}

    - name: Build ISO
      run: |
        cd /build
        mkdir -p out work
        mkarchiso -v -w work -o out ./archiso 2>&1

    - name: Upload ISO
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: methos-linux-iso
        path: /build/out/*.iso
        retention-days: 30