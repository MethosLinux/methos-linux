# Methos Linux - GitHub Actions ISO Builder
# Automatically builds the ISO on pushes to main and tags
name: Build Methos Linux ISO

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'ISO version override'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm archiso calamares grub \
          squashfs-tools libisoburn mtools dosfstools \
          make git base-devel python python-pip

    - name: Validate configuration
      run: make validate

    - name: Build ISO
      run: make iso
      env:
        VERSION: ${{ github.event.inputs.version || github.ref_name }}

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: methos-linux-iso
        path: out/*.iso
        retention-days: 30

    - name: Create Release (on tags only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: out/*.iso
        generate_release_notes: true