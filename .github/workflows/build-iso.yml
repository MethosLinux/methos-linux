# Methos Linux - GitHub Actions ISO Builder
# Zero Node.js actions (manual checkout)
# Captures all logs even on failure

name: Build Methos Linux ISO

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
    - name: 📦 Install dependencies
      run: |
        pacman -Syu --noconfirm 2>&1
        pacman -S --noconfirm \
          git archiso make base-devel grub \
          squashfs-tools libisoburn mtools dosfstools \
          python python-pip 2>&1
        echo "✅ Dependencies installed"

    - name: 📥 Checkout repo
      run: |
        git clone https://github.com/${{ github.repository }}.git /build 2>&1
        cd /build
        git checkout ${{ github.sha }} 2>&1
        echo "✅ Repo cloned at /build"

    - name: 📋 Show project structure
      run: |
        cd /build
        pwd
        ls -la
        echo "--- archiso ---"
        ls -la archiso/
        echo "--- archiso/profiles ---"
        ls -la archiso/profiles/ 2>/dev/null || echo "no profiles dir"
        echo "--- airootfs ---"
        ls -la archiso/airootfs/etc/ 2>/dev/null || echo "no airootfs"
        echo "--- VERSION ---"
        cat VERSION 2>/dev/null || echo "no version"
        echo "✅ Structure OK"

    - name: 🔧 Check archiso
      run: |
        mkarchiso -v 2>&1 || echo "mkarchiso not found"

    - name: 🏗️ Build ISO (attempt)
      id: build
      continue-on-error: true
      run: |
        cd /build
        mkdir -p out work
        mkarchiso -v -w work -o out ./archiso 2>&1 | tee /build/build.log
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: 📄 Show build log (first 200 lines)
      if: always()
      run: |
        if [ -f /build/build.log ]; then
          echo "=== BUILD LOG ==="
          head -200 /build/build.log
          echo "... (truncated)"
          echo "=== LAST 50 LINES ==="
          tail -50 /build/build.log
        else
          echo "No build.log found"
        fi

    - name: 📁 Show work dir
      if: always()
      run: |
        ls -la /build/work/ 2>/dev/null || echo "No work dir"
        ls -la /build/work/airootfs/ 2>/dev/null || echo "No airootfs in work"
        ls -la /build/out/ 2>/dev/null || echo "No out dir"
        find /build/work -name "*.iso" 2>/dev/null || echo "No ISO in work"
        find /build -name "*.iso" 2>/dev/null || echo "No ISO anywhere"

    - name: ⬆️ Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /build/build.log
        retention-days: 30

    - name: ⬆️ Upload ISO
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: methos-linux-iso
        path: /build/out/*.iso
        retention-days: 30

    - name: ✅ Final status
      if: always()
      run: |
        if [ -f /build/out/*.iso ]; then
          echo "✅ ISO BUILD SUCCESSFUL"
          ls -lh /build/out/
        else
          echo "❌ ISO BUILD FAILED - check build-log artifact"
        fi