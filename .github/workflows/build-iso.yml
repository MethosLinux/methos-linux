name: Build Methos Linux ISO

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
    - name: Install deps
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git archiso make base-devel \
          grub squashfs-tools libisoburn mtools dosfstools \
          python 2>&1

    - name: Checkout
      run: |
        git clone https://github.com/${{ github.repository }}.git /build
        cd /build && git checkout ${{ github.sha }}

    - name: Build
      run: |
        cd /build
        mkdir -p out work
        mkarchiso -v -w work -o out ./archiso 2>&1

    - name: Upload ISO
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: methos-linux-iso
        path: /build/out/*.iso
        retention-days: 30